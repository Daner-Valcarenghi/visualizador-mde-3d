<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador MDE & Ortofoto 3D</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js e OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Inter', sans-serif; background-color: #0f172a; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
    </style>
</head>
<body class="bg-slate-900 text-white select-none">

    <!-- Interface -->
    <div class="absolute top-4 left-4 z-10 bg-slate-800/90 backdrop-blur-md p-5 rounded-2xl shadow-2xl border border-slate-700 max-w-sm w-full">
        <h1 class="text-xl font-bold text-amber-400 flex items-center gap-2">
            <span>⛏️</span> Visualizador MDE & Ortofoto
        </h1>
        <p class="text-xs text-slate-400 mt-1">Carregue dados do drone para visualizar em 3D.</p>
        
        <div class="mt-4 space-y-3">
            <div>
                <label class="text-xs font-semibold text-slate-300 block mb-1">1. Carregar MDE / DEM (Elevação)</label>
                <input type="file" id="mde-file" accept="image/*" class="text-xs text-slate-400 file:mr-2 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-amber-600 file:text-white hover:file:bg-amber-500 cursor-pointer w-full">
            </div>

            <div>
                <label class="text-xs font-semibold text-slate-300 block mb-1">2. Carregar Ortofoto RGB (Foto)</label>
                <input type="file" id="ortho-file" accept="image/*" class="text-xs text-slate-400 file:mr-2 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-500 cursor-pointer w-full">
            </div>

            <div>
                <label class="text-xs font-semibold text-slate-300">Modo de Exibição</label>
                <div class="grid grid-cols-2 gap-2 mt-1">
                    <button id="btn-texture" onclick="setTextureMode('texture')" class="py-2 px-3 text-xs font-medium bg-slate-700 text-slate-400 rounded-lg opacity-50 cursor-not-allowed" disabled>Ortofoto RGB</button>
                    <button id="btn-topo" onclick="setTextureMode('topo')" class="py-2 px-3 text-xs font-medium bg-emerald-600 hover:bg-emerald-500 rounded-lg transition shadow">Topografia</button>
                </div>
            </div>

            <div>
                <div class="flex justify-between items-center">
                    <label class="text-xs font-semibold text-slate-300">Escala Vertical (Z)</label>
                    <span id="z-scale-val" class="text-xs text-amber-400 font-bold">1.0x</span>
                </div>
                <input type="range" id="z-scale" min="0.1" max="5" step="0.1" value="1" oninput="updateZScale(this.value)" class="w-full h-1 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-amber-500 mt-2">
            </div>

            <button onclick="resetCamera()" class="w-full mt-2 py-2 text-xs font-semibold bg-slate-700 hover:bg-slate-600 rounded-lg transition text-slate-200">
                Redefinir Câmera
            </button>
        </div>
    </div>

    <div id="toast" class="absolute bottom-6 left-1/2 -translate-x-1/2 z-10 bg-slate-800 border border-slate-700 px-4 py-2 rounded-xl text-xs shadow-xl transition-opacity duration-300 opacity-0 pointer-events-none"></div>
    <div id="canvas-container"></div>

    <script>
        let scene, camera, renderer, controls, terrainMesh, geometry, rawHeights = [];
        let orthoTexture = null;
        let currentMode = 'topo';
        const terrainSize = 200, segments = 120;

        function init() {
            if (typeof THREE === 'undefined') {
                alert('Erro: A biblioteca Three.js não pôde ser carregada. Verifique se possui bloqueadores de anúncios ativos.');
                return;
            }

            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(150, 120, 150);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(100, 200, 100);
            scene.add(dirLight);

            createDefaultTerrain();
            
            document.getElementById('mde-file').addEventListener('change', handleMDEUpload);
            document.getElementById('ortho-file').addEventListener('change', handleOrthoUpload);
            window.addEventListener('resize', onWindowResize);
            
            animate();
        }

        function createDefaultTerrain() {
            if(terrainMesh) scene.remove(terrainMesh);
            geometry = new THREE.PlaneGeometry(terrainSize, terrainSize, segments, segments);
            geometry.rotateX(-Math.PI / 2);
            
            const material = new THREE.MeshStandardMaterial({ color: 0x334155, wireframe: true });
            terrainMesh = new THREE.Mesh(geometry, material);
            scene.add(terrainMesh);
        }

        function handleMDEUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                canvas.width = segments + 1;
                canvas.height = segments + 1;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;

                rawHeights = [];
                const pos = geometry.attributes.position;
                for (let i = 0; i < pos.count; i++) {
                    const r = data[i * 4], g = data[i * 4 + 1], b = data[i * 4 + 2];
                    const val = (r + g + b) / 3;
                    const h = (val / 255) * 50 - 25;
                    rawHeights.push(h);
                    pos.setY(i, h);
                }
                geometry.computeVertexNormals();
                pos.needsUpdate = true;
                applyColorPalette();
                showToast("MDE Carregado com Sucesso!");
            };
            img.src = URL.createObjectURL(file);
        }

        function handleOrthoUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                new THREE.TextureLoader().load(event.target.result, (tex) => {
                    orthoTexture = tex;
                    const btn = document.getElementById('btn-texture');
                    btn.disabled = false;
                    btn.classList.remove('opacity-50', 'cursor-not-allowed', 'bg-slate-700');
                    btn.classList.add('bg-blue-600', 'hover:bg-blue-500', 'text-white');
                    setTextureMode('texture');
                    showToast("Ortofoto Carregada!");
                });
            };
            reader.readAsDataURL(file);
        }

        function applyColorPalette() {
            if (currentMode === 'texture' && orthoTexture) {
                terrainMesh.material = new THREE.MeshStandardMaterial({ map: orthoTexture, roughness: 0.6 });
            } else {
                const pos = geometry.attributes.position;
                const colors = [];
                for (let i = 0; i < pos.count; i++) {
                    const y = pos.getY(i);
                    const c = new THREE.Color();
                    if (y < -10) c.setHex(0x1e293b);
                    else if (y < 5) c.setHex(0x3f6212);
                    else if (y < 20) c.setHex(0x854d0e);
                    else c.setHex(0xd1d5db);
                    colors.push(c.r, c.g, c.b);
                }
                geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
                terrainMesh.material = new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true });
            }
        }

        function setTextureMode(mode) {
            currentMode = mode;
            applyColorPalette();
        }

        function updateZScale(val) {
            document.getElementById('z-scale-val').innerText = parseFloat(val).toFixed(1) + 'x';
            if (!rawHeights.length) return;
            const pos = geometry.attributes.position;
            for (let i = 0; i < pos.count; i++) {
                pos.setY(i, rawHeights[i] * val);
            }
            geometry.computeVertexNormals();
            pos.needsUpdate = true;
        }

        function resetCamera() {
            camera.position.set(150, 120, 150);
            controls.target.set(0, 0, 0);
            controls.update();
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.remove('opacity-0');
            setTimeout(() => t.classList.add('opacity-0'), 2500);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
